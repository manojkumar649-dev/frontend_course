<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscription Billing - Admin Login</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
background-size:400% 400%;
animation:bgMove 10s infinite alternate;
}

@keyframes bgMove{
0%{background-position:left;}
100%{background-position:right;}
}

.glass{
backdrop-filter:blur(18px);
background:rgba(255,255,255,.1);
border:1px solid rgba(255,255,255,.15);
}

</style>

</head>

<body class="min-h-screen flex items-center justify-center p-5">

<div class="glass w-full max-w-md rounded-3xl shadow-2xl p-8 text-white">

<div class="text-center">

<div class="w-20 h-20 mx-auto rounded-full bg-blue-500 flex items-center justify-center text-4xl shadow-lg">
💳
</div>

<h1 class="text-3xl font-bold mt-5">
Subscription Billing
</h1>

<p class="text-gray-300 mt-2">
Admin Control Panel
</p>

</div>

<form id="loginForm" class="mt-8 space-y-5">

<div>

<label class="text-sm">
Admin Email
</label>

<input
type="email"
id="email"
placeholder="admin@example.com"
class="mt-2 w-full rounded-xl bg-white/20 px-4 py-3 outline-none focus:ring-2 focus:ring-blue-400"
required>

</div>

<div>

<label class="text-sm">
Password
</label>

<div class="relative mt-2">

<input
type="password"
id="password"
placeholder="Enter Password"
class="w-full rounded-xl bg-white/20 px-4 py-3 pr-14 outline-none focus:ring-2 focus:ring-blue-400"
required>

<button
type="button"
onclick="togglePassword()"
class="absolute right-4 top-3 text-xl">

👁️

</button>

</div>

</div>

<div class="flex justify-between items-center text-sm">

<label class="flex items-center gap-2">

<input type="checkbox">

Remember Me

</label>

<a href="#" class="text-blue-300 hover:underline">
Forgot Password?
</a>

</div>

<button


class="w-full bg-blue-600 hover:bg-blue-700 transition rounded-xl py-3 font-semibold shadow-lg">
<a href="../PROJECT/main_dashboard.html"><p>
               LOGIN
            </p></a>


</button>

</form>

<div id="message" class="mt-5 text-center font-semibold"></div>

<hr class="my-8 border-white/20">

<div class="text-center text-gray-300 text-sm">

© 2026 Subscription Billing Management

</div>

</div>

<script>

function togglePassword(){

const pass=document.getElementById("password");

pass.type=pass.type==="password" ? "text":"password";

}

document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

const email=document.getElementById("email").value;

const password=document.getElementById("password").value;

const msg=document.getElementById("message");

const btn=document.getElementById("loginBtn");

btn.innerHTML="Logging In...";
btn.disabled=true;

setTimeout(()=>{

if(email==="manoj@gmail.com" && password==="manoj5678"){

localStorage.setItem("adminLogin","true");

msg.innerHTML="<span class='text-green-400'>Login Successful ✓</span>";

setTimeout(()=>{

window.location.href="dashboard.html";

},1000);

}

else{

msg.innerHTML="<span class='text-red-400'>Invalid Email or Password</span>";

btn.innerHTML="Login";
btn.disabled=false;

}

},1500);

});

</script>

</body>
</html>
