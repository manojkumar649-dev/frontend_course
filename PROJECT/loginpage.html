<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body class="bg-gray-100">

<div class="min-h-screen flex flex-col lg:flex-row">

    <!-- Left Side -->
    <div class="w-full lg:w-1/2 flex items-center justify-center bg-white p-10">

        <img
        src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
        alt="Illustration"
        class="w-80">

    </div>

    <!-- Right Side -->
    <div class="relative w-full lg:w-1/2 bg-blue-600 flex items-center justify-center overflow-hidden">

        <!-- Background Circles -->
        <div class="absolute -bottom-40 -right-40 w-96 h-96 border-2 border-white/30 rounded-full"></div>

        <div class="absolute -bottom-56 -right-56 w-[520px] h-[520px] border-2 border-white/20 rounded-full"></div>

        <!-- Login Card -->
        <div class="relative z-10 bg-white rounded-2xl shadow-2xl w-[360px] p-8">

            <h1 class="text-3xl font-bold text-gray-800">
                Hello!
            </h1>

            <p class="text-gray-500 mt-2 mb-8">
                Sign Up to Get Started
            </p>

            <!-- Email -->

            <div class="flex items-center border rounded-full px-4 py-3 mb-5">

                <i class="fa-solid fa-envelope text-gray-400"></i>

                <input
                    type="email"
                    placeholder="Email Address"
                    class="ml-3 w-full outline-none">

            </div>

            <!-- Password -->

            <div class="flex items-center border rounded-full px-4 py-3 mb-6">

                <i class="fa-solid fa-lock text-gray-400"></i>

                <input
                    type="password"
                    placeholder="Password"
                    class="ml-3 w-full outline-none">

            </div>

            <!-- Button -->

            <div>
                <button
                class="w-full bg-blue-600 hover:bg-blue-700 transition duration-300 text-white py-3 rounded-full font-semibold">

                Login

            </button>
            </div>

            <div class="mt-5 text-center">

                <a href="#" class="text-sm text-gray-500 hover:text-blue-600">
                    Forgot Password?
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
