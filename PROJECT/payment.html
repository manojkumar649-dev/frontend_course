<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Membership Payment</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
    background:linear-gradient(135deg,#111827,#000,#1f2937);
}
</style>

</head>
<body class="min-h-screen flex items-center justify-center p-6">

<div class="bg-white w-full max-w-5xl rounded-3xl shadow-2xl overflow-hidden">

<div class="grid md:grid-cols-2">

<!-- LEFT -->
<div class="bg-black text-white p-10">

<h1 class="text-4xl font-bold mb-3">
💪 FitZone Gym
</h1>

<p class="text-gray-300 mb-8">
Complete your membership payment securely.
</p>

<div class="space-y-4">

<div class="flex justify-between">
<span>Basic Plan</span>
<span>₹999</span>
</div>

<div class="flex justify-between">
<span>Standard Plan</span>
<span>₹1,999</span>
</div>

<div class="flex justify-between">
<span>Premium Plan</span>
<span>₹2,999</span>
</div>

<hr class="border-gray-700">

<div class="flex justify-between text-xl font-bold">

<span>Total</span>

<span id="total">₹999</span>

</div>

</div>

</div>

<!-- RIGHT -->

<div class="p-8">

<h2 class="text-3xl font-bold mb-6 text-center">
Membership Payment
</h2>

<form id="paymentForm" class="space-y-5">

<input
id="name"
type="text"
placeholder="Member Name"
required
class="w-full border rounded-lg p-3">

<input
id="email"
type="email"
placeholder="Email"
required
class="w-full border rounded-lg p-3">

<select
id="plan"
class="w-full border rounded-lg p-3">

<option value="999">Basic - ₹999</option>
<option value="1999">Standard - ₹1,999</option>
<option value="2999">Premium - ₹2,999</option>

</select>

<input
id="coupon"
type="text"
placeholder="Coupon Code (FIT10)"
class="w-full border rounded-lg p-3">

<select
id="payment"
class="w-full border rounded-lg p-3">

<option>UPI</option>
<option>Credit Card</option>
<option>Debit Card</option>
<option>Net Banking</option>

</select>

<input
type="text"
placeholder="Card / UPI Number"
required
class="w-full border rounded-lg p-3">

<div class="grid grid-cols-2 gap-4">

<input
type="text"
placeholder="Expiry"
required
class="border rounded-lg p-3">

<input
type="password"
placeholder="CVV / PIN"
required
class="border rounded-lg p-3">

</div>

<button
class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-bold">

Pay Now

</button>

</form>

<div
id="success"
class="hidden mt-6 bg-green-100 border border-green-500 text-green-700 rounded-lg p-4">

<h3 class="font-bold text-lg">
✅ Payment Successful
</h3>

<p class="mt-2">
Thank you for joining FitZone Gym.
</p>

</div>

</div>

</div>

</div>

<script>

const total=document.getElementById("total");
const plan=document.getElementById("plan");
const coupon=document.getElementById("coupon");

function updatePrice(){

let amount=parseInt(plan.value);

if(coupon.value.toUpperCase()=="FIT10"){
amount=amount-(amount*0.10);
}

total.innerHTML="₹"+amount;

}

plan.addEventListener("change",updatePrice);
coupon.addEventListener("keyup",updatePrice);

document.getElementById("paymentForm").addEventListener("submit",function(e){

e.preventDefault();

document.getElementById("success").classList.remove("hidden");

this.reset();

total.innerHTML="₹999";

});

</script>

</body>
</html>
